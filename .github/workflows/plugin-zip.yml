name: Package Figma plugin

# On every v* tag, build the plugin zip and attach it to the tag's GitHub
# release (created if missing). Set the repository variable
# PLUMB_PLUGIN_REMOTE_URL to pre-fill a central server URL; the pairing key is
# never baked in. On a public repository leave it unset: the release is public
# and the URL would name your bridge path. Users type the URL in Server….

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Actions pinned by commit SHA (tag in the comment). The checkout keeps no
# token in .git/config, so `npm ci` install scripts can't reach it; only the
# upload step gets GH_TOKEN.
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run package:plugin
        env:
          PLUMB_PLUGIN_REMOTE_URL: ${{ vars.PLUMB_PLUGIN_REMOTE_URL }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist-plugin/*.zip --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plumb-figma-plugin
          path: dist-plugin/*.zip
